<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Finanzas</title>
<style>
:root{
  --tinta:#14161c;      /* fondo */
  --papel:#f2f3f5;      /* texto principal */
  --grafito:#1e212a;    /* superficie de card */
  --linea:#2c3140;      /* bordes */
  --tenue:#8b93a7;      /* texto secundario */
  --papel2:#c9cfdb;     /* secundario alto contraste (tablas sobre fondo oscuro) */
  --alerta:#e8b23a;     /* vencido sin cerrar */
  --ok:#5fbf7f;
  --radio:14px;
  --mono:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
body{
  background:var(--tinta);color:var(--papel);font-family:var(--sans);
  font-size:15px;line-height:1.45;
  padding:0 0 calc(84px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ── header ─────────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:20;background:rgba(20,22,28,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:12px;
}
header h1{
  font-size:13px;font-weight:600;margin:0;flex:1;
  text-transform:uppercase;letter-spacing:.14em;color:var(--tenue);
}
.iconbtn{
  background:none;border:1px solid var(--linea);color:var(--tenue);
  width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer;
  display:grid;place-items:center;
}
.iconbtn:active{background:var(--grafito)}
.iconbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--papel);outline-offset:2px}
#estado{font-size:11px;color:var(--tenue);font-family:var(--mono)}
#estado.girando{animation:pulso 1.1s ease-in-out infinite}
@keyframes pulso{50%{opacity:.35}}

main{padding:14px 14px 0;max-width:560px;margin:0 auto}

/* ── card de emisor ─────────────────────────────────────── */
.emisor{
  background:var(--grafito);border:1px solid var(--linea);border-radius:var(--radio);
  padding:15px 16px 16px;margin-bottom:12px;position:relative;overflow:hidden;
}
.emisor::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#888);
}
.etop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.enom{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.eper{font-size:11px;color:var(--tenue);font-family:var(--mono)}
.montos{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.m1{font-size:29px;font-weight:600}
.m2{font-size:15px;color:var(--tenue)}
.vacio{font-size:13px;color:var(--tenue);margin:2px 0 8px}

/* ── medidor de ciclo (elemento firma) ──────────────────── */
.ciclo{margin:14px 0 9px}
.pista{
  position:relative;height:22px;border-left:1px solid var(--linea);
  border-right:1px solid var(--linea);
}
.pista::before{
  content:"";position:absolute;left:0;right:0;top:10px;height:1px;
  background:repeating-linear-gradient(90deg,var(--linea) 0 4px,transparent 4px 8px);
}
.avance{position:absolute;left:0;top:10px;height:1px;background:var(--c,#888)}
.hoy{
  position:absolute;top:4px;width:2px;height:14px;background:var(--papel);
  transform:translateX(-1px);
}
.hoy::after{
  content:attr(data-t);position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  font-size:9px;font-family:var(--mono);color:var(--papel);white-space:nowrap;
}
.corte{
  position:absolute;right:0;top:2px;width:1px;height:18px;background:var(--c,#888);
}
.ejes{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tenue);
  font-family:var(--mono);margin-top:3px}
.cierra{font-size:12px;margin-top:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill{
  font-size:10.5px;font-family:var(--mono);padding:2px 7px;border-radius:99px;
  border:1px solid var(--linea);color:var(--tenue);
}
.pill.urg{border-color:var(--c);color:var(--papel)}
.pill.alerta{border-color:var(--alerta);color:var(--alerta)}

.tarjetas{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--linea)}
.chip{
  font-size:11px;font-family:var(--mono);border:1px solid var(--linea);
  border-radius:8px;padding:5px 9px;color:var(--tenue);
}
.chip b{color:var(--papel);font-weight:600}

/* ── categorías ─────────────────────────────────────────── */
.bloque{margin:18px 0 0}
.bloque h2{font-size:11px;text-transform:uppercase;letter-spacing:.14em;
  color:var(--tenue);margin:0 0 10px;font-weight:600}
.cat{display:grid;grid-template-columns:1fr auto;gap:3px 10px;
  align-items:baseline;margin-bottom:9px}
.cat .n{font-size:13px}
.cat .v{font-size:13px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.barra{grid-column:1/-1;height:3px;background:var(--linea);border-radius:2px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--tenue);border-radius:2px}

/* ── acción principal ───────────────────────────────────── */
.fab{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--tinta) 62%,transparent);
}
.fab button{
  width:100%;max-width:532px;margin:0 auto;display:block;
  background:var(--papel);color:var(--tinta);border:0;border-radius:12px;
  padding:15px;font-size:15px;font-weight:650;font-family:var(--sans);cursor:pointer;
}
.fab button:active{transform:scale(.985)}

/* ── hoja modal ─────────────────────────────────────────── */
dialog{
  border:0;padding:0;background:transparent;max-width:560px;width:100%;
  margin:auto auto 0;color:var(--papel);
}
dialog::backdrop{background:rgba(0,0,0,.6)}
.hoja{
  background:var(--grafito);border:1px solid var(--linea);
  border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;
}
.hoja h3{margin:0 0 14px;font-size:15px;font-weight:650}
label{display:block;font-size:11px;color:var(--tenue);margin:0 0 5px;
  text-transform:uppercase;letter-spacing:.08em}
input,select{
  width:100%;background:var(--tinta);border:1px solid var(--linea);color:var(--papel);
  border-radius:10px;padding:11px 12px;font-size:16px;font-family:var(--sans);
}
input[type=number],input[type=date],input[type=time]{font-family:var(--mono)}
.campo{margin-bottom:13px}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:0;border:1px solid var(--linea);border-radius:10px;overflow:hidden}
.seg button{
  flex:1;background:var(--tinta);border:0;color:var(--tenue);padding:11px;
  font-size:14px;font-family:var(--mono);cursor:pointer;
}
.seg button[aria-pressed=true]{background:var(--papel);color:var(--tinta);font-weight:650}
.aviso{
  border:1px solid var(--alerta);border-radius:10px;padding:11px 12px;
  font-size:12.5px;margin-bottom:13px;color:var(--alerta);
}
.aviso .opc{display:flex;gap:8px;margin-top:9px}
.aviso .opc button{
  flex:1;background:transparent;border:1px solid var(--linea);color:var(--papel);
  border-radius:8px;padding:9px;font-size:12px;font-family:var(--mono);cursor:pointer;
}
.aviso .opc button[aria-pressed=true]{background:var(--alerta);color:var(--tinta);border-color:var(--alerta)}
.acciones{display:flex;gap:10px;margin-top:6px}
.acciones button{
  flex:1;border-radius:11px;padding:14px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:var(--sans);
}
.btn-p{background:var(--papel);color:var(--tinta);border:0}
.btn-s{background:transparent;color:var(--tenue);border:1px solid var(--linea)}
.error{color:#ff8f8f;font-size:12.5px;margin-top:10px;min-height:1em}

/* ── toast ──────────────────────────────────────────────── */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);
  background:var(--papel);color:var(--tinta);padding:11px 16px;border-radius:10px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;z-index:40;
  transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;
}
#toast.ver{opacity:1;transform:translate(-50%,0)}

.pendientes{
  border:1px dashed var(--alerta);border-radius:10px;padding:10px 12px;
  font-size:12.5px;color:var(--alerta);margin-bottom:12px;
}
.centro{text-align:center;color:var(--tenue);padding:40px 20px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── censura de montos ──────────────────────────────────── */
body.censurado .plata{filter:blur(9px);transition:filter .12s;cursor:default;user-select:none}
/* ── info de cierre (reemplaza el medidor de barra) ─────── */
.cierreinfo{margin:12px 0 4px;font-size:11px;color:var(--tenue);font-family:var(--mono)}
.cierreinfo b{color:var(--papel);font-weight:600}
/* ── detalle de gastos ──────────────────────────────────── */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros select{width:auto;flex:1;min-width:120px;padding:9px 10px;font-size:13px}
.filtros button{width:auto;padding:9px 12px}
.tabla{width:100%;border-collapse:collapse;font-size:12.5px}
.tabla th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--papel2);text-align:left;padding:7px 8px;border-bottom:1px solid var(--linea);font-weight:600;white-space:nowrap}
.tabla th.num{text-align:right}
.tabla td{padding:8px 8px;border-bottom:1px solid var(--linea);vertical-align:top;color:var(--papel)}
.tabla td.num{text-align:right;white-space:nowrap}
.tabla tr:last-child td{border-bottom:none}
.tabla .cmts{color:var(--papel2);font-size:11px}
.thsort{cursor:pointer;user-select:none}
.det-tot{font-size:12px;color:var(--papel2);font-family:var(--mono);margin-top:12px;text-align:right}
.det-tot b{color:var(--papel)}
/* ── vistas PC / Mobile ─────────────────────────────────── */
body.vista-pc main{max-width:1080px}
body.vista-pc #app{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,440px));gap:12px;align-items:stretch;justify-content:center}
body.vista-pc #app>.emisor{margin-bottom:0}
body.vista-pc #app>.pendientes,body.vista-pc #app>.bloque{grid-column:1/-1}
@media (min-width:900px){
  body.vista-auto main{max-width:1080px}
  body.vista-auto #app{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,440px));gap:12px;align-items:stretch;justify-content:center}
  body.vista-auto #app>.emisor{margin-bottom:0}
  body.vista-auto #app>.pendientes,body.vista-auto #app>.bloque{grid-column:1/-1}
}
/* ── detalle: color por tipo de tarjeta + tamaño ───────── */
#dlgDetalle{max-width:1200px;width:75vw;margin:auto}
#dlgDetalle .hoja{border-radius:16px;max-height:82vh}
@media (max-width:760px){
  #dlgDetalle{width:100%;max-width:560px;margin:auto auto 0}
  #dlgDetalle .hoja{border-radius:16px 16px 0 0;max-height:88vh}
}
.tabla td{padding:10px 10px}
.tabla .cmerc{font-weight:600}
.tabla tbody tr:hover td{background:rgba(255,255,255,.035)}
.tdcard .cbanco{color:var(--papel2);font-size:11px;margin-right:5px}
.ptag{display:inline-block;font-size:11px;font-family:var(--mono);border:1px solid var(--tc,var(--linea));color:var(--tc,var(--tenue));border-radius:7px;padding:2px 7px;white-space:nowrap}
/* ── por-tarjeta dentro de la card de banco ─────────────── */
.portarj{margin:11px 0 2px;display:flex;flex-direction:column;gap:7px}
.ptrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ptval{font-size:13.5px}
/* ── históricos ─────────────────────────────────────────── */
#dlgHist{max-width:1200px;width:82vw;margin:auto}
#dlgHist .hoja{border-radius:16px;max-height:86vh}
@media (max-width:760px){ #dlgHist{width:100%;max-width:560px;margin:auto auto 0} #dlgHist .hoja{border-radius:16px 16px 0 0;max-height:90vh} }
.hmes{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--linea);border-radius:10px;margin-bottom:7px;cursor:pointer}
.hmes.sel{border-color:var(--papel)}
.hmes input{width:auto;margin:0;flex:0 0 auto}
.hmes .hnom{flex:1;font-weight:600;text-transform:capitalize}
.hchip{display:inline-block;font-size:10px;font-family:var(--mono);border:1px solid var(--tc,var(--linea));color:var(--tc,var(--tenue));border-radius:6px;padding:2px 6px;white-space:nowrap}
.kpirow{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.kpirow .kpi{background:var(--tinta);border:1px solid var(--linea);border-radius:12px;padding:12px 14px;min-width:150px}
.kpirow .kl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--papel2)}
.kpirow .kv{font-size:22px;font-weight:600;margin-top:4px;color:var(--papel)}
.hbar-row{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.hbar-row .hl{font-size:13px;color:var(--papel);text-transform:capitalize}
.hbar-track{height:10px;background:var(--linea);border-radius:5px;overflow:hidden}
.hbar-track i{display:block;height:100%;border-radius:5px;background:var(--c,var(--tenue))}
.hbar-row .hv{font-size:12px;color:var(--papel2);white-space:nowrap;text-align:right}
.hsec{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--papel2);margin:20px 0 11px;font-weight:600}
.hcols{display:flex;gap:6px;align-items:flex-end;min-height:170px;border-bottom:1px solid var(--linea);padding:0 2px 0}
.hcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:30px}
.hcol .cbar{width:64%;background:var(--c,var(--tenue));border-radius:4px 4px 0 0;min-height:2px}
.hcol .clbl{font-size:9.5px;color:var(--papel2);font-family:var(--mono);white-space:nowrap}
.hcol .cval{font-size:9px;color:var(--tenue);font-family:var(--mono)}
/* ── navegación con nombres ─────────────────────────────── */
nav#nav{display:flex;gap:2px;padding:0 12px;max-width:1080px;margin:6px auto 0;border-bottom:1px solid var(--linea);overflow-x:auto}
nav#nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--tenue);font-size:14px;font-weight:600;padding:12px 14px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
nav#nav button[aria-current="true"]{color:var(--papel);border-bottom-color:var(--papel)}
nav#nav button:active{opacity:.7}
.vista{max-width:1080px;margin:0 auto;padding:0}
</style>
</head>
<body>

<header>
  <h1>Finanzas</h1>
  <span id="estado"></span>
  <button class="iconbtn" id="btnVer" aria-label="Censurar montos" aria-pressed="false">👁</button>
  <button class="iconbtn" id="btnSync" aria-label="Actualizar">↻</button>
  <button class="iconbtn" id="btnCfg" aria-label="Ajustes">⚙</button>
</header>

<nav id="nav">
  <button type="button" data-v="inicio" aria-current="true">Inicio</button>
  <button type="button" data-v="detalle" aria-current="false">Detalle de gastos</button>
  <button type="button" data-v="hist" aria-current="false">Históricos</button>
</nav>

<main>
  <div id="app"><div class="centro">Cargando…</div></div>
  <section id="viewDetalle" class="vista" hidden>
    <div class="filtros">
      <select id="fCat"></select>
      <select id="fTarjeta"></select>
    </div>
    <div id="detBody"><div class="centro">Tocá "Detalle de gastos" arriba.</div></div>
    <div class="det-tot" id="detTot"></div>
  </section>
  <section id="viewHist" class="vista" hidden>
    <div id="histBody"><div class="centro">Cargando…</div></div>
  </section>
</main>

<div class="fab"><button id="btnGasto">Cargar gasto</button></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- ── hoja: nuevo gasto ── -->
<dialog id="dlgGasto">
  <form method="dialog" class="hoja" id="formGasto">
    <h3>Cargar gasto</h3>
    <div id="avisoCierre"></div>
    <div class="campo">
      <label for="gMonto">Monto</label>
      <input type="number" id="gMonto" inputmode="decimal" step="0.01" min="0" required placeholder="0,00">
    </div>
    <div class="campo">
      <label>Moneda</label>
      <div class="seg" id="segMoneda">
        <button type="button" data-v="ARS" aria-pressed="true">ARS</button>
        <button type="button" data-v="USD" aria-pressed="false">USD</button>
      </div>
    </div>
    <div class="campo">
      <label for="gTarjeta">Tarjeta</label>
      <select id="gTarjeta" required></select>
    </div>
    <div class="fila">
      <div class="campo"><label for="gFecha">Fecha</label><input type="date" id="gFecha" required></div>
      <div class="campo"><label for="gHora">Hora</label><input type="time" id="gHora" required></div>
    </div>
    <div class="campo">
      <label for="gComercio">Comercio</label>
      <input type="text" id="gComercio" placeholder="Opcional" autocomplete="off">
    </div>
    <div class="fila">
      <div class="campo"><label for="gCat">Categoría</label><select id="gCat"></select></div>
      <div class="campo"><label for="gTitular">Titular</label><select id="gTitular"></select></div>
    </div>
    <p class="error" id="errGasto"></p>
    <div class="acciones">
      <button type="button" class="btn-s" id="gCancelar">Cancelar</button>
      <button type="submit" class="btn-p" id="gGuardar">Guardar</button>
    </div>
  </form>
</dialog>

<!-- ── hoja: ajustes ── -->
<dialog id="dlgCfg">
  <form method="dialog" class="hoja" id="formCfg">
    <h3>Conexión</h3>
    <div class="campo">
      <label for="cUrl">URL del Web App</label>
      <input type="url" id="cUrl" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    </div>
    <div class="campo">
      <label for="cToken">Token</label>
      <input type="text" id="cToken" required autocomplete="off">
    </div>
    <div class="campo">
      <label>Vista</label>
      <div class="seg" id="segVista">
        <button type="button" data-v="auto" aria-pressed="true">Auto</button>
        <button type="button" data-v="pc" aria-pressed="false">PC</button>
        <button type="button" data-v="mobile" aria-pressed="false">Mobile</button>
      </div>
    </div>
    <p class="error" id="errCfg"></p>
    <div class="acciones">
      <button type="button" class="btn-s" id="cCancelar">Cancelar</button>
      <button type="submit" class="btn-p">Probar y guardar</button>
    </div>
  </form>
</dialog>


<script>
"use strict";

/* ══ estado ══════════════════════════════════════════════ */
var LS = {
  cfg: 'fa.cfg', datos: 'fa.datos', cola: 'fa.cola', cats: 'fa.cats',
  censura: 'fa.censura', vista: 'fa.vista'
};
var CATEGORIAS = ['Delivery','Gastronomía','Supermercado','Combustible','Entretenimiento',
  'Salud','Viajes','Suscripciones','Indumentaria','Transporte','Impuestos','Compras','Otros'];
var TITULARES = ['Cristóbal','Mila','Extensión'];

var cfg = leer(LS.cfg, null);
var datos = leer(LS.datos, null);
var cola = leer(LS.cola, []);
var monedaSel = 'ARS';
var periodoElegido = null;   // override del día de cierre
var cargando = false;
var censurado = leer(LS.censura, false);
var vista = leer(LS.vista, 'auto');   // 'auto' | 'pc' | 'mobile'

function leer(k, def) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
  catch (e) { return def; }
}
function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ══ formato ═════════════════════════════════════════════ */
var fmtARS = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function plata(n, mon) {
  var s = fmtARS.format(Math.abs(n || 0));
  return (mon === 'USD' ? 'U$S ' : '$ ') + s;
}
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
             'agosto','septiembre','octubre','noviembre','diciembre'];
function nombrePeriodo(p) {
  if (!p) return '';
  var a = p.split('-');
  return MESES[parseInt(a[1], 10) - 1] + ' ' + a[0];
}
function dm(iso) {  // 2026-07-30 -> 30/7
  if (!iso) return '—';
  var a = iso.split('-');
  return parseInt(a[2], 10) + '/' + parseInt(a[1], 10);
}
function hoyISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}
function horaAhora() {
  var d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function mesRelativo(delta) {
  var d = new Date();
  d.setDate(1); d.setMonth(d.getMonth() + delta);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function diasEntre(a, b) {
  return Math.round((Date.parse(b + 'T00:00:00') - Date.parse(a + 'T00:00:00')) / 86400000);
}

/* ══ API ═════════════════════════════════════════════════ */
function api(action, params, body) {
  if (!cfg || !cfg.url) return Promise.reject(new Error('Falta configurar la conexión'));
  var u = cfg.url + (cfg.url.indexOf('?') < 0 ? '?' : '&') +
          'action=' + encodeURIComponent(action) + '&token=' + encodeURIComponent(cfg.token);
  Object.keys(params || {}).forEach(function (k) {
    if (params[k] !== undefined && params[k] !== null && params[k] !== '')
      u += '&' + k + '=' + encodeURIComponent(params[k]);
  });
  var opt = { method: 'GET', redirect: 'follow' };
  if (body) {
    var payload = {};
    Object.keys(body).forEach(function (k) { payload[k] = body[k]; });
    payload.action = action; payload.token = cfg.token;
    // text/plain evita el preflight CORS: Apps Script no responde OPTIONS.
    opt = { method: 'POST', redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload) };
  }
  return fetch(u, opt).then(function (r) {
    return r.text().then(function (t) {
      var j;
      try { j = JSON.parse(t); }
      catch (e) { throw new Error('Respuesta no válida. ¿La URL termina en /exec?'); }
      if (j.ok === false) throw new Error(j.error || 'Error del servidor');
      return j;
    });
  });
}

/* ══ refresco ════════════════════════════════════════════ */
function refrescar() {
  if (cargando || !cfg) return Promise.resolve();
  cargando = true;
  marcarEstado('actualizando…', true);

  return api('calendario', { desde: mesRelativo(-1), meses: 4 })
    .then(function (cal) {
      return api('bancos').then(function (b) { return { cal: cal.calendario, bancos: b.bancos }; });
    })
    .then(function (base) {
      var ciclos = armarCiclos(base.cal, base.bancos);
      var periodos = {};
      ciclos.forEach(function (c) { periodos[c.periodo] = true; });
      var lista = Object.keys(periodos);
      return Promise.all(lista.map(function (p) { return api('resumen', { periodo: p }); }))
        .then(function (rs) {
          var porPeriodo = {};
          lista.forEach(function (p, i) { porPeriodo[p] = rs[i]; });
          ciclos.forEach(function (c) {
            var r = porPeriodo[c.periodo];
            var pb = (r.por_banco || {})[c.banco_id] || { ars: 0, usd: 0, count: 0 };
            c.ars = pb.ars; c.usd = pb.usd; c.count = pb.count;
            c.tc = r.tc_usd_ars;
            c.categorias = r.por_categoria || {};
            c.porTarjeta = r.por_tarjeta || null;   // lo sirve el backend nuevo (resumen)
          });
          function terminar() {
            ciclos.forEach(function (c) { if (!c.porTarjeta) c.porTarjeta = {}; });
            datos = { ciclos: ciclos, ts: Date.now() };
            guardar(LS.datos, datos);
            pintar();
            marcarEstado(horaAhora(), false);
          }
          // Fallback: backend viejo sin por_tarjeta -> lo calculamos desde gastos (1 lectura extra).
          var faltan = ciclos.filter(function (c) { return c.tipo !== 'billetera' && !c.porTarjeta; });
          if (faltan.length) {
            return api('gastos', { limit: 2000 }).then(function (g) {
              asignarPorTarjeta(faltan, (g && (g.gastos || g.items || g.data)) || []);
              terminar();
            }).catch(terminar);
          }
          terminar();
        });
    })
    .catch(function (e) {
      marcarEstado('sin conexión', false);
      if (!datos) pintarError(e.message);
      else toast(e.message);
    })
    .then(function () { cargando = false; });
}

/**
 * Un ciclo por emisor: su período ABIERTO (el primero cuyo cierre no pasó).
 * Los períodos ya vencidos y todavía abiertos se marcan aparte.
 */
function armarCiclos(cal, bancos) {
  var meta = {};
  (bancos || []).forEach(function (b) { meta[b.id] = b; });

  var porEmisor = {};
  cal.forEach(function (bloque) {
    bloque.tarjetas.forEach(function (t) {
      if (!t.activa || !t.fecha_cierre) return;
      if (!porEmisor[t.banco_id]) porEmisor[t.banco_id] = [];
      var e = porEmisor[t.banco_id];
      var p = null;
      for (var i = 0; i < e.length; i++) if (e[i].periodo === bloque.periodo) p = e[i];
      if (!p) {
        p = { periodo: bloque.periodo, fecha_cierre: t.fecha_cierre, hora_cierre: t.hora_cierre,
              dias_cierre: t.dias_cierre, estado: t.estado_periodo, tarjetas: [] };
        e.push(p);
      }
      p.tarjetas.push(t);
    });
  });

  var out = [];
  Object.keys(porEmisor).forEach(function (bid) {
    var lista = porEmisor[bid].sort(function (a, b) { return a.periodo < b.periodo ? -1 : 1; });
    var abierto = null, vencidos = [];
    lista.forEach(function (p) {
      if (p.dias_cierre >= 0 && !abierto) abierto = p;
      else if (p.dias_cierre < 0 && p.estado === 'abierto') vencidos.push(p);
    });
    if (!abierto) abierto = lista[lista.length - 1];
    if (!abierto) return;

    var idx = lista.indexOf(abierto);
    var previo = idx > 0 ? lista[idx - 1] : null;
    var b = meta[bid] || {};
    out.push({
      banco_id: bid,
      nombre: b.nombre || bid,
      color: b.color || '#8b93a7',
      tipo: b.tipo || '',
      periodo: abierto.periodo,
      fecha_cierre: abierto.fecha_cierre,
      hora_cierre: abierto.hora_cierre || '17:00',
      dias_cierre: abierto.dias_cierre,
      desde: previo ? previo.fecha_cierre : null,
      tarjetas: abierto.tarjetas,
      vencidos: vencidos.map(function (v) { return { periodo: v.periodo, fecha: v.fecha_cierre }; }),
      ars: 0, usd: 0, count: 0, categorias: {}
    });
  });
  return out;
}

/* ══ pintado ═════════════════════════════════════════════ */
function pintar() {
  var app = document.getElementById('app');
  if (!cfg) {
    app.innerHTML = '<div class="centro">Configurá la conexión con el botón ⚙ para empezar.</div>';
    return;
  }
  if (!datos || !datos.ciclos || !datos.ciclos.length) {
    app.innerHTML = '<div class="centro">Sin datos todavía. Tocá ↻ para traerlos.</div>';
    return;
  }
  var h = '';
  if (cola.length) {
    h += '<div class="pendientes">' + cola.length + ' gasto' + (cola.length > 1 ? 's' : '') +
         ' sin enviar. Se manda' + (cola.length > 1 ? 'n' : '') + ' solo cuando vuelva la señal.</div>';
  }
  datos.ciclos.forEach(function (c) { h += cardEmisor(c); });
  h += bloqueCategorias(datos.ciclos);
  app.innerHTML = h;
}

function cardEmisor(c) {
  var urg = c.dias_cierre <= 1;
  var txtCierre = c.dias_cierre === 0 ? 'cierra hoy ' + c.hora_cierre
                : c.dias_cierre === 1 ? 'cierra mañana ' + c.hora_cierre
                : c.dias_cierre > 0   ? 'cierra en ' + c.dias_cierre + ' días'
                : 'cerró hace ' + Math.abs(c.dias_cierre) + ' días';

  var h = '<article class="emisor" style="--c:' + c.color + '">';
  h += '<div class="etop"><span class="enom">' + esc(c.nombre) + '</span>' +
       '<span class="eper">' + nombrePeriodo(c.periodo) + '</span></div>';

  if (c.count === 0) {
    h += '<p class="vacio">' + (c.tipo === 'billetera'
      ? 'Sin movimientos cargados. Agregalos antes de cerrar el período.'
      : 'Sin consumos en este ciclo todavía.') + '</p>';
  } else {
    h += '<div class="montos"><span class="m1 num plata">' + plata(c.ars, 'ARS') + '</span>';
    if (c.usd) h += '<span class="m2 num plata">' + plata(c.usd, 'USD') + '</span>';
    h += '</div>';
    h += '<div class="eper">' + c.count + ' consumo' + (c.count > 1 ? 's' : '') + '</div>';
  }

  h += bloquePorTarjeta(c);
  h += medidorCiclo(c);

  h += '<div class="cierra"><span class="pill' + (urg ? ' urg' : '') + '">' + txtCierre + '</span>';
  c.vencidos.forEach(function (v) {
    h += '<span class="pill alerta">' + nombrePeriodo(v.periodo) + ' sin cerrar</span>';
  });
  h += '</div>';

  if (c.tarjetas.length) {
    h += '<div class="tarjetas">';
    c.tarjetas.forEach(function (t) {
      h += '<span class="chip"><b>' + esc(t.nombre) + '</b>' +
           (t.ultimos_digitos ? ' ·' + t.ultimos_digitos : '') +
           ' &nbsp;vence ' + dm(t.fecha_vencimiento) + '</span>';
    });
    h += '</div>';
  }
  return h + '</article>';
}

/**
 * Medidor de ciclo: dónde cae hoy entre el cierre anterior y el próximo.
 * Es la única cosa que esta app sabe y un resumen mensual común no: el
 * período de facturación no es el mes calendario.
 */
function medidorCiclo(c) {
  var ini = c.desde, fin = c.fecha_cierre;
  var rango = (ini ? dm(ini) + ' → ' : '') + dm(fin) + ' · ' + c.hora_cierre;
  return '<div class="cierreinfo">ciclo <b>' + rango + '</b></div>';
}

function bloqueCategorias(ciclos) {
  var acum = {};
  ciclos.forEach(function (c) {
    Object.keys(c.categorias).forEach(function (k) {
      var v = c.categorias[k];
      var ars = (v.ars || 0) + (v.usd || 0) * (c.tc || 0);
      acum[k] = (acum[k] || 0) + ars;
    });
  });
  var pares = Object.keys(acum).map(function (k) { return [k, acum[k]]; })
    .filter(function (p) { return p[1] > 0; })
    .sort(function (a, b) { return b[1] - a[1]; });
  if (!pares.length) return '';
  var max = pares[0][1];
  var h = '<section class="bloque"><h2>Por categoría · equivalente en pesos</h2>';
  pares.forEach(function (p) {
    h += '<div class="cat"><span class="n">' + esc(p[0]) + '</span>' +
         '<span class="v plata">' + plata(p[1], 'ARS') + '</span>' +
         '<span class="barra"><i style="width:' + ((p[1] / max) * 100).toFixed(1) + '%"></i></span></div>';
  });
  return h + '</section>';
}

function pintarError(msg) {
  document.getElementById('app').innerHTML =
    '<div class="centro">' + esc(msg) + '<br><br>Revisá la conexión con ⚙.</div>';
}
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function marcarEstado(t, girando) {
  var el = document.getElementById('estado');
  el.textContent = t;
  el.className = girando ? 'girando' : '';
}
var tToast;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('ver');
  clearTimeout(tToast);
  tToast = setTimeout(function () { el.classList.remove('ver'); }, 2600);
}

function abrirGasto() {
  if (!cfg) { toast('Configurá la conexión primero'); return abrirCfg(); }
  if (!datos || !datos.ciclos.length) { toast('Traé los datos con ↻ antes de cargar'); return; }

  var sel = document.getElementById('gTarjeta');
  sel.innerHTML = '';
  datos.ciclos.forEach(function (c) {
    c.tarjetas.forEach(function (t) {
      var o = document.createElement('option');
      o.value = c.banco_id + '|' + t.id + '|' + t.origen;
      o.textContent = c.nombre + ' · ' + t.nombre + (t.ultimos_digitos ? ' ·' + t.ultimos_digitos : '');
      sel.appendChild(o);
    });
  });
  llenar('gCat', CATEGORIAS, 'Otros');

  document.getElementById('gFecha').value = hoyISO();
  document.getElementById('gHora').value = horaAhora();

  document.getElementById('gComercio').value = '';

  setTimeout(function () { document.getElementById('gMonto').focus(); }, 120);

function llenar(id, arr, def) {
  var s = document.getElementById(id);
  s.innerHTML = '';
  arr.forEach(function (v) {
    var o = document.createElement('option');
    o.value = v; o.textContent = v; if (v === def) o.selected = true;
    s.appendChild(o);
  });
}
function pintarSeg() {
  Array.prototype.forEach.call(document.querySelectorAll('#segMoneda button'), function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.v === monedaSel));
  });
}
function cicloSeleccionado() {
  var v = document.getElementById('gTarjeta').value || '';
  var bid = v.split('|')[0];
  for (var i = 0; i < datos.ciclos.length; i++) if (datos.ciclos[i].banco_id === bid) return datos.ciclos[i];
  return null;
}

/** Si la fecha cae justo el día de cierre, el período es ambiguo: preguntamos. */
function revisarDiaDeCierre() {
  var caja = document.getElementById('avisoCierre');
  var c = cicloSeleccionado();
  var f = document.getElementById('gFecha').value;
  if (!c || f !== c.fecha_cierre) { caja.innerHTML = ''; periodoElegido = null; return; }

  var sig = siguientePeriodo(c.periodo);
  if (periodoElegido === null) periodoElegido = c.periodo;
  caja.innerHTML =
    '<div class="aviso">Es el día de cierre de ' + esc(c.nombre) + '. Hasta las ' +
    c.hora_cierre + ' entra en este período; después, en el siguiente.' +
    '<div class="opc">' +
    '<button type="button" data-p="' + c.periodo + '" aria-pressed="' + (periodoElegido === c.periodo) + '">' +
      nombrePeriodo(c.periodo) + '</button>' +
    '<button type="button" data-p="' + sig + '" aria-pressed="' + (periodoElegido === sig) + '">' +
      nombrePeriodo(sig) + '</button></div></div>';

  Array.prototype.forEach.call(caja.querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () {
      periodoElegido = b.dataset.p;
      Array.prototype.forEach.call(caja.querySelectorAll('button'), function (x) {
        x.setAttribute('aria-pressed', String(x.dataset.p === periodoElegido));
      });
    });
  });
}
function siguientePeriodo(p) {
  var a = p.split('-'), y = +a[0], m = +a[1] + 1;
  if (m > 12) { m = 1; y++; }
  return y + '-' + String(m).padStart(2, '0');
}

function enviarGasto(ev) {
  ev.preventDefault();
  var err = document.getElementById('errGasto');
  var monto = parseFloat(document.getElementById('gMonto').value);
  if (!(monto > 0)) { err.textContent = 'Poné un monto mayor a cero.'; return; }
  var v = (document.getElementById('gTarjeta').value || '').split('|');
  if (v.length < 3) { err.textContent = 'Elegí una tarjeta.'; return; }

  var cuerpo = {
    fecha: document.getElementById('gFecha').value,
    hora: document.getElementById('gHora').value || '12:00',
    banco_id: v[0], tarjeta_id: v[1], origen: v[2],
    moneda: monedaSel, monto: monto,
    categoria: document.getElementById('gCat').value,
    comercio: document.getElementById('gComercio').value.trim(),
    titular: document.getElementById('gTitular').value
  };
  if (periodoElegido) cuerpo.periodo = periodoElegido;

  var btn = document.getElementById('gGuardar');
  btn.disabled = true; btn.textContent = 'Guardando…';

  api('gasto_nuevo', {}, cuerpo)
    .then(function (r) {
      document.getElementById('dlgGasto').close();
      toast('Guardado en ' + nombrePeriodo(r.periodo));
      return refrescar();
    })
    .catch(function (e) {
      cola.push(cuerpo); guardar(LS.cola, cola);
      document.getElementById('dlgGasto').close();
      toast('Sin conexión. Queda en cola.');
      pintar();
    })
    .then(function () { btn.disabled = false; btn.textContent = 'Guardar'; });
}

/* ══ cola offline ════════════════════════════════════════ */
function vaciarCola() {
  if (!cola.length || !cfg) return Promise.resolve();
  var pendientes = cola.slice();
  var quedan = [];
  return pendientes.reduce(function (p, g) {
    return p.then(function () {
      return api('gasto_nuevo', {}, g).catch(function () { quedan.push(g); });
    });
  }, Promise.resolve()).then(function () {
    var enviados = pendientes.length - quedan.length;
    cola = quedan; guardar(LS.cola, cola);
    if (enviados) { toast(enviados + ' gasto' + (enviados > 1 ? 's' : '') + ' enviado' + (enviados > 1 ? 's' : '')); return refrescar(); }
  });
}

/* ══ detalle de gastos ═══════════════════════════════════ */
var detGastos = [];
var detOrden = 'desc';
function nombreTarjeta(tid) {
  if (!datos || !datos.ciclos) return tid || '—';
  for (var i = 0; i < datos.ciclos.length; i++) {
    var ts = datos.ciclos[i].tarjetas || [];
    for (var j = 0; j < ts.length; j++) if (ts[j].id === tid)
      return datos.ciclos[i].nombre + ' · ' + ts[j].nombre + (ts[j].ultimos_digitos ? ' ·' + ts[j].ultimos_digitos : '');
  }
  return tid || '—';
}
function tarjetaInfo(tid) {
  if (datos && datos.ciclos) {
    for (var i = 0; i < datos.ciclos.length; i++) {
      var c = datos.ciclos[i], ts = c.tarjetas || [];
      for (var j = 0; j < ts.length; j++) if (ts[j].id === tid)
        return { banco: c.nombre, card: ts[j].nombre + (ts[j].ultimos_digitos ? ' ·' + ts[j].ultimos_digitos : ''), origen: ts[j].origen };
    }
  }
  return { banco: '', card: tid || '—', origen: '' };
}
function colorOrigen(o) {
  o = (o || '').toLowerCase();
  if (o.indexOf('visa') >= 0) return '#60A5FA';
  if (o.indexOf('amex') >= 0 || o.indexOf('american') >= 0) return '#5fbf7f';
  if (o.indexOf('master') >= 0) return '#e8b23a';
  if (o.indexOf('mp') >= 0 || o.indexOf('mercado') >= 0) return '#009EE3';
  return 'var(--tenue)';
}
function asignarPorTarjeta(ciclos, gastos) {
  var idx = {};
  ciclos.forEach(function (c) { idx[c.periodo + '|' + c.banco_id] = c; c.porTarjeta = {}; });
  (gastos || []).forEach(function (g) {
    var c = idx[(g.periodo || '') + '|' + (g.banco_id || '')];
    if (!c) return;
    var tid = g.tarjeta_id || g.tarjeta; if (!tid) return;
    var b = c.porTarjeta[tid] || (c.porTarjeta[tid] = { ars: 0, usd: 0, count: 0 });
    if ((g.moneda || 'ARS') === 'USD') b.usd += (+g.monto || 0); else b.ars += (+g.monto || 0);
    b.count++;
  });
}
function bloquePorTarjeta(c) {

  });

}
function mostrarVista(v){

function abrirDetalle() {
  if (!cfg) { toast('Configurá la conexión primero'); return abrirCfg(); }
  document.getElementById('detBody').innerHTML = '<div class="centro">Cargando gastos…</div>';
  document.getElementById('detTot').textContent = '';

    .then(function (r) {

    })

}
function construirFiltrosDetalle() {
  var cats = {}, tarj = {};
  detGastos.forEach(function (g) {
    if (g.categoria) cats[g.categoria] = true;
    var tid = g.tarjeta_id || g.tarjeta;
    if (tid) tarj[tid] = true;
  });
  document.getElementById('fCat').innerHTML = '<option value="">Todas las categorías</option>' +
    Object.keys(cats).sort().map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
  document.getElementById('fTarjeta').innerHTML = '<option value="">Todas las tarjetas</option>' +
    Object.keys(tarj).sort().map(function (t) { return '<option value="' + esc(t) + '">' + esc(nombreTarjeta(t)) + '</option>'; }).join('');

function pintarDetalle() {
  var fc = document.getElementById('fCat').value;
  var ft = document.getElementById('fTarjeta').value;
  var filas = detGastos.filter(function (g) {
    if (fc && g.categoria !== fc) return false;
    var tid = g.tarjeta_id || g.tarjeta;
    if (ft && tid !== ft) return false;
    return true;
  });
  filas.sort(function (a, b) {
    var fa = (a.fecha_hora || a.fecha || ''), fb = (b.fecha_hora || b.fecha || '');
    if (fa === fb) return 0;
    return (fa < fb ? -1 : 1) * (detOrden === 'asc' ? 1 : -1);
  });
  var body = document.getElementById('detBody');
  if (!filas.length) {
    body.innerHTML = '<div class="centro">Sin gastos para ese filtro.</div>';
    document.getElementById('detTot').textContent = ''; return;
  }
  var totA = 0, totU = 0;
  var h = '<table class="tabla"><thead><tr>' +
    '<th class="thsort" id="thFecha">Fecha ' + (detOrden === 'asc' ? '▲' : '▼') + '</th>' +
    '<th>Comercio / categoría</th><th>Tarjeta</th><th class="num">Monto</th></tr></thead><tbody>';
  filas.forEach(function (g) {
    var mon = g.moneda || 'ARS';
    if (mon === 'USD') totU += (+g.monto || 0); else totA += (+g.monto || 0);
    var tid = g.tarjeta_id || g.tarjeta;
    var ti = tarjetaInfo(tid), col = colorOrigen(ti.origen);
    h += '<tr>' +
      '<td class="num" style="border-left:3px solid ' + col + '">' + esc(dm(g.fecha)) + '</td>' +
      '<td><span class="cmerc">' + esc(g.comercio || '—') + '</span>' +
      '<div class="cmts">' + esc(g.categoria || '') + (g.titular ? ' · ' + esc(g.titular) : '') + '</div></td>' +
      '<td class="tdcard"><span class="cbanco">' + esc(ti.banco) + '</span><span class="ptag" style="--tc:' + col + '">' + esc(ti.card) + '</span></td>' +
      '<td class="num plata">' + plata(g.monto, mon) + '</td></tr>';
  });
  h += '</tbody></table>';
  body.innerHTML = h;
  var thF = document.getElementById('thFecha');
  if (thF) thF.addEventListener('click', function () { detOrden = (detOrden === 'asc' ? 'desc' : 'asc'); pintarDetalle(); });
  document.getElementById('detTot').innerHTML = filas.length + ' gasto' + (filas.length > 1 ? 's' : '') +
    ' · <b class="plata">' + plata(totA, 'ARS') + '</b>' + (totU ? ' · <b class="plata">' + plata(totU, 'USD') + '</b>' : '');
}

/* ══ HISTÓRICOS: parser pdf.js + análisis ════════════════ */
var MES3H = { ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11 };
var MONEYH = /^\d[\d.]*,\d{2}-?$/;
function b64toU8(b){ var s=atob(b), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i); return u; }
function pMontoH(s){ if(!s) return 0; var neg=/-\s*$/.test(s); s=String(s).replace(/[^\d.,]/g,''); if(!s) return 0; s=s.replace(/\./g,'').replace(',','.'); var n=parseFloat(s)||0; return neg?-n:n; }
function catHist(desc){
  var d=(desc||'').toLowerCase();
  if(/rappi|pedidosya|pedidos ya|propina/.test(d)) return 'Delivery';
  if(/starbucks|havanna|coffit|cafe|helado|burger|pizza|resto|coffee|jobs bar|biggpalermo/.test(d)) return 'Gastronomía';
  if(/dia tienda|cencosud|coto|carrefour|jumbo|disco|supermercado|hawaii market|geaval/.test(d)) return 'Supermercado';
  if(/ypf|shell|axion|combustible/.test(d)) return 'Combustible';
  if(/cinemark|cine |ticketmaster|teatro|movistar arena|minisod|hoyts|nintendo|xbox|playstation/.test(d)) return 'Entretenimiento';
  if(/farmacity|farmacia|farma/.test(d)) return 'Salud';
  if(/holafly|travel|vuelo|aerolineas|latam|hotel|zoo|auckland/.test(d)) return 'Viajes';
  if(/google|netflix|spotify|disney|hbo|youtube|amazon prime|apple|claude|kindle|personal|edenor/.test(d)) return 'Suscripciones';
  if(/zara|nike|adidas|ropa|moda|decathlon|loveandlemon|shein|target|crocs|calvin|western|todo moda/.test(d)) return 'Indumentaria';
  if(/uber|cabify|didi|sube|peaje|estacionamiento|parkingdot/.test(d)) return 'Transporte';
  if(/interes|iva |impuesto|sellos|percep|db\.rg/.test(d)) return 'Impuestos';
  if(/merpago|mercadopago|mercado pago|payu|paypal/.test(d)) return 'Compras';
  return 'Otros';
}
function _isoY(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
async function parseResumenPDF(u8, tipoHint){
  var doc = await window.pdfjsLib.getDocument({data:u8}).promise;
  var rows=[];
  for(var p=1;p<=doc.numPages;p++){
    var page=await doc.getPage(p); var tc=await page.getTextContent(); var byY={};
    tc.items.forEach(function(it){ if(!it.str.trim())return; var y=Math.round(it.transform[5]); (byY[y]=byY[y]||[]).push({x:it.transform[4],s:it.str}); });
    Object.keys(byY).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){ rows.push(byY[y].sort(function(a,b){return a.x-b.x;})); });
  }
  function cM(items,lo,hi){ var c=items.filter(function(o){return o.x>=lo&&o.x<hi&&MONEYH.test(o.s.trim());}).sort(function(a,b){return a.x-b.x;}); return c.length?pMontoH(c[c.length-1].s):null; }
  function cT(items,lo,hi){ return items.filter(function(o){return o.x>=lo&&o.x<hi;}).map(function(o){return o.s;}).join(' ').replace(/\s+/g,' ').trim(); }
  var R={tipo:tipoHint||null, periodo:null, cierre:null, venc:null, cardholders:[], impuestos:{ars:0,usd:0}, categorias:{}, totalARS:0, totalUSD:0};
  var buf=[];
  for(var i=0;i<rows.length;i++){
    var items=rows[i]; var full=items.map(function(o){return o.s;}).join(' ');
    if(!R.tipo){ if(/AMERICAN\s+EXPRESS|AMEX/i.test(full)) R.tipo='AMEX'; else if(/VISA/i.test(full)) R.tipo='VISA'; }
    var mC=full.match(/CIERRE\s+(\d{1,2})\s+([A-Za-z]{3})\w*\s+(\d{2})/); if(mC&&!R.cierre){ var mm=MES3H[mC[2].toLowerCase().slice(0,3)]; if(mm!=null){ R.cierre=_isoY(2000+ +mC[3],mm,+mC[1]); R.periodo=(2000+ +mC[3])+'-'+String(mm+1).padStart(2,'0'); } }
    var mV=full.match(/VENCIMIENTO\s+(\d{1,2})\s+([A-Za-z]{3})\w*\s+(\d{2})/); if(mV&&!R.venc){ var vm=MES3H[mV[2].toLowerCase().slice(0,3)]; if(vm!=null) R.venc=_isoY(2000+ +mV[3],vm,+mV[1]); }
    var mT=full.match(/Tarjeta\s+(\d{4})\s+Total\s+Consumos\s+de\s+(.+?)\s+[\d.,]+\s*\*/i);
    if(mT){
      var toks=items.filter(function(o){return MONEYH.test(o.s.trim());}).sort(function(a,b){return a.x-b.x;});
      var sA=0,sU=0; buf.forEach(function(b){sA+=b.ars;sU+=b.usd;});
      R.cardholders.push({tarjeta:mT[1], nombre:mT[2].replace(/\s+/g,' ').trim(),
        declarado:{ars:toks[0]?pMontoH(toks[0].s):0, usd:toks[1]?pMontoH(toks[1].s):0},
        ars:Math.round(sA*100)/100, usd:Math.round(sU*100)/100, consumos:buf});
      buf=[]; continue;
    }
    if(/IMPUESTO|IIBB|IVA\s|SELLOS|DB\.RG|PERCEP/i.test(full)){ var ia=cM(items,395,475), iu=cM(items,490,560); R.impuestos.ars+=ia||0; R.impuestos.usd+=iu||0; continue; }
    if(!/\b\d{1,2}\s+\d{6}\b/.test(full)) continue;
    var ars=cM(items,395,475), usd=cM(items,490,560);
    if(ars===null&&usd===null) continue;
    var ref=cT(items,120,340).replace(/\bUSD\s+[\d.,]+/g,'').replace(/[A-Z]{3}\s*$/,'').trim();
    var cuo=ref.match(/C\.(\d{2})\/(\d{2})/); ref=ref.replace(/C\.\d{2}\/\d{2}/,'').replace(/\s+/g,' ').trim();
    buf.push({ref:ref, ars:ars||0, usd:usd||0, cuota:cuo?(parseInt(cuo[1],10)+'/'+parseInt(cuo[2],10)):null, cat:catHist(ref)});
  }
  R.cardholders.forEach(function(ch){ ch.consumos.forEach(function(k){ R.totalARS+=k.ars; R.totalUSD+=k.usd; var ct=R.categorias[k.cat]=R.categorias[k.cat]||{ars:0,usd:0}; ct.ars+=k.ars; ct.usd+=k.usd; }); });
  if(R.impuestos.ars||R.impuestos.usd){ var im=R.categorias['Impuestos']=R.categorias['Impuestos']||{ars:0,usd:0}; im.ars+=R.impuestos.ars; im.usd+=R.impuestos.usd; }
  R.totalARS=Math.round((R.totalARS+R.impuestos.ars)*100)/100;
  R.totalUSD=Math.round((R.totalUSD+R.impuestos.usd)*100)/100;
  return R;
}

/* ── pdf.js lazy loader (cdnjs, solo cuando se abre históricos) ── */
var _pdfP=null;
function cargarPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(_pdfP) return _pdfP;
  _pdfP=new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(); };
    s.onerror=function(){ _pdfP=null; rej(new Error('No pude cargar pdf.js. Necesitás conexión para los históricos.')); };
    document.head.appendChild(s);
  });
  return _pdfP;
}

/* ── estado históricos ── */
var histLista = null;         // del backend
var histCache = leer('fa.histcache', {});   // id -> parsed
var histSel = {};             // periodo -> bool
var histModo = 'mes';         // 'mes' | 'comparar'
var histSerie = 'total';      // total | VISA | AMEX (en comparar)

function colorTipo(t){ return t==='VISA' ? '#60A5FA' : t==='AMEX' ? '#5fbf7f' : 'var(--tenue)'; }
function titularDe(nom){ return /MILA|TORRES/i.test(nom||'') ? 'Mila' : 'Cristóbal'; }
function mesCorto(p){ var a=p.split('-'); return MESES[+a[1]-1].slice(0,3)+" '"+a[0].slice(2); }

function parsearHistorico(item){
  if(histCache[item.id]) return Promise.resolve(histCache[item.id]);
  return cargarPdfJs().then(function(){ return api('historico_pdf',{id:item.id}); })
    .then(function(r){ return parseResumenPDF(b64toU8(r.base64), item.tarjeta_tipo); })
    .then(function(parsed){ histCache[item.id]=parsed; try{ guardar('fa.histcache', histCache); }catch(e){} return parsed; });
}

function agruparMeses(historicos){
  var meses={};
  historicos.forEach(function(h){
    if(!h.vencimiento) return;
    var d=h.vencimiento.split('-'); var y=+d[0], m=+d[1]-1;   // mes de vencimiento
    var pm=m-1, py=y; if(pm<0){pm=11;py--;}                    // período ≈ venc - 1 mes (cierre)
    var key=py+'-'+String(pm+1).padStart(2,'0');
    var g=meses[key]||(meses[key]={periodo:key, VISA:null, AMEX:null});
    g[h.tarjeta_tipo]=h;
  });
  return Object.keys(meses).sort().reverse().map(function(k){return meses[k];});
}

function abrirHist(){
  if(!cfg){ toast('Configurá la conexión primero'); return abrirCfg(); }
  var cont=document.getElementById('histBody');
  cont.innerHTML='<div class="centro">Cargando lista…</div>';
  api('historicos').then(function(r){
    histLista=agruparMeses(r.historicos||[]);
    histSel={}; renderHistSel();
  }).catch(function(e){ cont.innerHTML='<div class="centro">'+esc(e.message)+'</div>'; });
}

function renderHistSel(){
  var cont=document.getElementById('histBody');
  var n=Object.keys(histSel).filter(function(k){return histSel[k];}).length;
  var h='<div class="hsec" style="margin-top:2px">Elegí uno o varios meses</div>';
  h+='<div class="seg" id="histModo" style="margin-bottom:12px;max-width:320px">'+
     '<button type="button" data-v="mes" aria-pressed="'+(histModo==='mes')+'">Un mes</button>'+
     '<button type="button" data-v="comparar" aria-pressed="'+(histModo==='comparar')+'">Comparar</button></div>';
  histLista.forEach(function(g){
    var sel=!!histSel[g.periodo];
    h+='<label class="hmes '+(sel?'sel':'')+'"><input type="checkbox" data-p="'+g.periodo+'" '+(sel?'checked':'')+'>'+
       '<span class="hnom">'+nombrePeriodo(g.periodo)+'</span>'+
       (g.VISA?'<span class="hchip" style="--tc:#60A5FA">VISA</span>':'<span class="hchip">sin VISA</span>')+
       (g.AMEX?'<span class="hchip" style="--tc:#5fbf7f">AMEX</span>':'<span class="hchip">sin AMEX</span>')+'</label>';
  });
  h+='<button class="btn-p" id="histAnalizar" style="width:100%;margin-top:12px;padding:13px;border-radius:11px;border:0;font-weight:600" '+(n?'':'disabled')+'>Analizar '+(n?('('+n+')'):'')+'</button>';
  h+='<div id="histRes" style="margin-top:18px"></div>';
  cont.innerHTML=h;
  Array.prototype.forEach.call(cont.querySelectorAll('#histModo button'),function(b){ b.addEventListener('click',function(){ histModo=b.dataset.v; renderHistSel(); }); });
  Array.prototype.forEach.call(cont.querySelectorAll('.hmes input'),function(cb){ cb.addEventListener('change',function(){ histSel[cb.dataset.p]=cb.checked; renderHistSel(); }); });
  var ba=document.getElementById('histAnalizar'); if(ba) ba.addEventListener('click', analizarHist);
}

function analizarHist(){
  var periodos=Object.keys(histSel).filter(function(k){return histSel[k];});
  if(!periodos.length) return;
  if(histModo==='mes') periodos=periodos.slice(0,1);
  var res=document.getElementById('histRes');
  res.innerHTML='<div class="centro">Parseando '+periodos.length+' mes(es)… la primera vez baja pdf.js.</div>';
  var grupos=histLista.filter(function(g){return periodos.indexOf(g.periodo)>=0;});
  var jobs=[];
  grupos.forEach(function(g){ ['VISA','AMEX'].forEach(function(t){ if(g[t]) jobs.push({g:g,t:t,item:g[t]}); }); });
  Promise.all(jobs.map(function(j){ return parsearHistorico(j.item).then(function(p){ j.parsed=p; }).catch(function(){ j.parsed=null; }); }))
    .then(function(){
      var meses=grupos.map(function(g){
        var v=(jobs.filter(function(j){return j.g===g&&j.t==='VISA';})[0]||{}).parsed||null;
        var a=(jobs.filter(function(j){return j.g===g&&j.t==='AMEX';})[0]||{}).parsed||null;
        return combinarMes(g.periodo, v, a);
      }).sort(function(a,b){return a.periodo<b.periodo?-1:1;});
      if(histModo==='mes') renderUnMes(meses[0]); else renderComparar(meses);
    });
}

function combinarMes(periodo, v, a){
  var M={periodo:(v&&v.periodo)||(a&&a.periodo)||periodo, porTarjeta:{}, porTitular:{Cristóbal:{ars:0,usd:0},Mila:{ars:0,usd:0}}, porCat:{}, imp:{ars:0,usd:0}, totARS:0, totUSD:0, consumos:[]};
  [['VISA',v],['AMEX',a]].forEach(function(pair){
    var tipo=pair[0], r=pair[1]; if(!r) return;
    M.porTarjeta[tipo]={ars:r.totalARS,usd:r.totalUSD};
    M.imp.ars+=r.impuestos.ars; M.imp.usd+=r.impuestos.usd;
    M.totARS+=r.totalARS; M.totUSD+=r.totalUSD;
    Object.keys(r.categorias).forEach(function(k){ var c=M.porCat[k]=M.porCat[k]||{ars:0,usd:0}; c.ars+=r.categorias[k].ars; c.usd+=r.categorias[k].usd; });
    r.cardholders.forEach(function(ch){ var t=titularDe(ch.nombre); M.porTitular[t].ars+=ch.ars; M.porTitular[t].usd+=ch.usd;
      ch.consumos.forEach(function(k){ M.consumos.push({tarjeta:tipo,titular:t,ref:k.ref,ars:k.ars,usd:k.usd,cuota:k.cuota,cat:k.cat}); }); });
  });
  M.totARS=Math.round(M.totARS*100)/100; M.totUSD=Math.round(M.totUSD*100)/100;
  return M;
}

function barras(obj, colorFn){
  var pares=Object.keys(obj).map(function(k){return [k,obj[k]];}).filter(function(p){return (p[1].ars||p[1])>0;})
    .sort(function(a,b){return (b[1].ars||b[1])-(a[1].ars||a[1]);});
  if(!pares.length) return '<div class="vacio">Sin datos</div>';
  var max=pares[0][1].ars||pares[0][1];
  return pares.map(function(p){ var val=p[1].ars!==undefined?p[1].ars:p[1]; var usd=p[1].usd||0;
    var col=colorFn?colorFn(p[0]):'var(--tenue)';
    return '<div class="hbar-row"><span class="hl">'+esc(p[0])+'</span>'+
      '<span class="hbar-track"><i style="width:'+Math.max(2,(val/max)*100).toFixed(1)+'%;--c:'+col+'"></i></span>'+
      '<span class="hv plata">'+plata(val,'ARS')+(usd?(' · '+plata(usd,'USD')):'')+'</span></div>';
  }).join('');
}

function renderUnMes(M){
  var h='<div class="hsec" style="margin-top:0">'+nombrePeriodo(M.periodo)+' · total del mes</div>';
  h+='<div class="kpirow">'+
    '<div class="kpi"><div class="kl">Total ARS</div><div class="kv num plata">'+plata(M.totARS,'ARS')+'</div></div>'+
    (M.totUSD?'<div class="kpi"><div class="kl">Total USD</div><div class="kv num plata">'+plata(M.totUSD,'USD')+'</div></div>':'')+
    '<div class="kpi"><div class="kl">Impuestos incl.</div><div class="kv num plata">'+plata(M.imp.ars,'ARS')+'</div></div></div>';
  h+='<div class="hsec">Por método de pago</div>'+barras(M.porTarjeta, colorTipo);
  h+='<div class="hsec">Por titular</div>'+barras(M.porTitular, function(t){return t==='Mila'?'#e8b23a':'#c9cfdb';});
  h+='<div class="hsec">Por categoría</div>'+barras(M.porCat, null);
  h+='<div class="hsec">Consumos ('+M.consumos.length+')</div>';
  h+='<div style="overflow-x:auto"><table class="tabla"><thead><tr><th>Comercio</th><th>Categoría</th><th>Tarjeta</th><th>Titular</th><th class="num">Monto</th></tr></thead><tbody>';
  M.consumos.sort(function(a,b){return (b.ars+b.usd*1500)-(a.ars+a.usd*1500);}).forEach(function(k){
    h+='<tr><td><span class="cmerc">'+esc(k.ref||'—')+'</span>'+(k.cuota?' <span class="hchip">cuota '+k.cuota+'</span>':'')+'</td>'+
      '<td class="cmts">'+esc(k.cat)+'</td>'+
      '<td><span class="ptag" style="--tc:'+colorTipo(k.tarjeta)+'">'+k.tarjeta+'</span></td>'+
      '<td class="cmts">'+esc(k.titular)+'</td>'+
      '<td class="num plata">'+plata(k.usd?k.usd:k.ars, k.usd?'USD':'ARS')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  document.getElementById('histRes').innerHTML=h;
}

function renderComparar(meses){
  var serieVal=function(M){ if(histSerie==='total') return M.totARS; var t=M.porTarjeta[histSerie]; return t?t.ars:0; };
  var max=Math.max.apply(null, meses.map(serieVal).concat([1]));
  var h='<div class="hsec" style="margin-top:0">Comparar meses — ARS</div>';
  h+='<div class="seg" id="histSerie" style="margin-bottom:14px;max-width:360px">'+
    ['total','VISA','AMEX'].map(function(s){return '<button type="button" data-v="'+s+'" aria-pressed="'+(histSerie===s)+'">'+(s==='total'?'Total':s)+'</button>';}).join('')+'</div>';
  h+='<div class="hcols">';
  meses.forEach(function(M){ var val=serieVal(M); var col=histSerie==='total'?'#c9cfdb':colorTipo(histSerie);
    h+='<div class="hcol"><span class="cval plata">'+(val>=1000?Math.round(val/1000)+'k':Math.round(val))+'</span>'+
      '<div class="cbar" style="height:'+Math.max(2,(val/max)*140).toFixed(0)+'px;--c:'+col+'"></div>'+
      '<span class="clbl">'+mesCorto(M.periodo)+'</span></div>';
  });
  h+='</div>';
  // evolución por categoría (tabla meses x categorías)
  var cats={}; meses.forEach(function(M){ Object.keys(M.porCat).forEach(function(k){ cats[k]=(cats[k]||0)+M.porCat[k].ars; }); });
  var topCats=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];}).slice(0,8);
  h+='<div class="hsec">Evolución por categoría (ARS)</div><div style="overflow-x:auto"><table class="tabla"><thead><tr><th>Categoría</th>'+
    meses.map(function(M){return '<th class="num">'+mesCorto(M.periodo)+'</th>';}).join('')+'</tr></thead><tbody>';
  topCats.forEach(function(cat){ h+='<tr><td class="cmerc">'+esc(cat)+'</td>'+
    meses.map(function(M){ var v=(M.porCat[cat]||{}).ars||0; return '<td class="num plata" style="color:'+(v?'var(--papel)':'var(--tenue)')+'">'+(v?plata(v,'ARS').replace('$ ',''):'—')+'</td>'; }).join('')+'</tr>'; });
  h+='</tbody></table></div>';
  document.getElementById('histRes').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#histSerie button'),function(b){ b.addEventListener('click',function(){ histSerie=b.dataset.v; renderComparar(meses); }); });
}
